<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 28 28%27%3E%3Cpath d=%27M5 21C10 21 10 7 14 7s4 14 9 14%27 fill=%27none%27 stroke=%27%23C9BEDA%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3Ccircle cx=%275%27 cy=%2721%27 r=%273.5%27 fill=%27%232C6CB0%27/%3E%3Ccircle cx=%2714%27 cy=%277%27 r=%273.5%27 fill=%27%235B2A86%27/%3E%3Ccircle cx=%2723%27 cy=%2721%27 r=%273.5%27 fill=%27%23E39B12%27/%3E%3C/svg%3E">
<title>Jobtrail — job application tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F3F8;--surface:#fff;--surface-2:#EFEBF4;--ink:#241B2F;--ink-2:#625775;--ink-3:#958CA5;--line:#E3DDEA;--plum:#5B2A86;--plum-ink:#fff;--plum-soft:#EEE5F7;--mari:#B97700;--mari-bright:#E39B12;--mari-soft:#FCEFD3;--ok:#1F8657;--ok-soft:#DCF1E6;--bad:#C2384F;--bad-soft:#F8E0E4;--info:#2C6CB0;--info-soft:#E0EBF7;--gray:#7C7488;--gray-soft:#ECE9F0;--shadow:0 1px 2px rgba(36,27,47,.06),0 10px 30px rgba(36,27,47,.10);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16111C;--surface:#201927;--surface-2:#2A2232;--ink:#F2EDF7;--ink-2:#B6ACC4;--ink-3:#857B94;--line:#382E43;--plum:#BC93E8;--plum-ink:#1B1222;--plum-soft:#34254A;--mari:#F0B23E;--mari-bright:#F0B23E;--mari-soft:#3A2D13;--ok:#53C38E;--ok-soft:#163024;--bad:#EE7085;--bad-soft:#3C1A22;--info:#76AEEB;--info-soft:#16283D;--gray:#A49BB1;--gray-soft:#2D2635;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16111C;--surface:#201927;--surface-2:#2A2232;--ink:#F2EDF7;--ink-2:#B6ACC4;--ink-3:#857B94;--line:#382E43;--plum:#BC93E8;--plum-ink:#1B1222;--plum-soft:#34254A;--mari:#F0B23E;--mari-bright:#F0B23E;--mari-soft:#3A2D13;--ok:#53C38E;--ok-soft:#163024;--bad:#EE7085;--bad-soft:#3C1A22;--info:#76AEEB;--info-soft:#16283D;--gray:#A49BB1;--gray-soft:#2D2635;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);color-scheme:dark}

/* stage colour pairs */
.st-saved,.st-withdrawn{--c:var(--gray);--cs:var(--gray-soft)}
.st-applied{--c:var(--info);--cs:var(--info-soft)}
.st-screening{--c:var(--mari);--cs:var(--mari-soft)}
.st-interviewing{--c:var(--plum);--cs:var(--plum-soft)}
.st-offer,.st-accepted{--c:var(--ok);--cs:var(--ok-soft)}
.st-rejected{--c:var(--bad);--cs:var(--bad-soft)}
.st-ghosted,.st-closed{--c:var(--gray);--cs:var(--gray-soft)}
.rs-scheduled{--c:var(--info);--cs:var(--info-soft)}
.rs-awaiting{--c:var(--mari);--cs:var(--mari-soft)}
.rs-passed{--c:var(--ok);--cs:var(--ok-soft)}
.rs-failed{--c:var(--bad);--cs:var(--bad-soft)}
.rs-cancelled{--c:var(--gray);--cs:var(--gray-soft)}

*{box-sizing:border-box}
html,body{height:100%}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;margin:0;letter-spacing:-.01em;line-height:1.2}
p{margin:0}
a{color:var(--plum)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
kbd{font:600 11px/1 'Figtree',sans-serif;padding:3px 6px;border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink-3)}
.ic{flex:none}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.center{justify-content:center}
.spacer{flex:1}
.hint{font-size:13px;color:var(--ink-3)}
.pad{padding:24px 8px;text-align:center}

/* layout */
.app{display:grid;grid-template-columns:228px 1fr;height:100%}
.nav{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 22px;font:700 21px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.nav-btn{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;border:0;background:none;color:var(--ink-2);cursor:pointer;font-weight:500;text-align:left;width:100%}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--plum-soft);color:var(--plum);font-weight:600}
.nav-btn kbd{margin-left:auto}
.nav-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding:18px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar h1{font-size:25px;font-weight:700}
#saveState{margin-right:auto}
.sync-chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);background:none;border:0;padding:5px 9px;border-radius:8px;cursor:pointer}
.sync-chip:hover{background:var(--surface-2);color:var(--ink)}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.sdot.warn{background:var(--mari-bright)}.sdot.bad{background:var(--bad)}
.sdot.busy{background:var(--info);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.steps{margin:4px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:14.5px;max-width:70ch}
.steps li::marker{font-weight:700;color:var(--plum)}
details.conn summary{cursor:pointer;font-size:14px;color:var(--ink-2);margin-top:14px}
.search{position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:11px;color:var(--ink-3);pointer-events:none}
.search input{width:270px;padding:8px 38px 8px 36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);outline:none}
.search input:focus{border-color:var(--plum);box-shadow:0 0 0 3px var(--plum-soft)}
.search kbd{position:absolute;right:9px}
.content{flex:1;overflow:auto;padding:22px 28px 48px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink);transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink-3)}
.btn-primary{background:var(--plum);color:var(--plum-ink);border-color:transparent}
.btn-primary:hover{border-color:transparent;filter:brightness(1.1)}
.btn-ai{background:var(--mari-soft);border-color:transparent}
.btn-ai .ic{color:var(--mari-bright)}
.btn-ai:hover{border-color:var(--mari-bright)}
.btn-ghost{border-color:transparent;background:none}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.icon-only{padding:7px}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn[disabled]{opacity:.6;cursor:progress}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* inputs */
.input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--plum);box-shadow:0 0 0 3px var(--plum-soft)}
textarea.input{resize:vertical;min-height:84px;line-height:1.55}
select.input{cursor:pointer}
.input.sm{width:auto;padding:6px 10px;font-size:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span,.field .lbl{font-size:13px;font-weight:500;color:var(--ink-2)}
.field.full{grid-column:1/-1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.input-row{display:flex;gap:8px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* chips & pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--cs);color:var(--c);white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--c)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--gray-soft);color:var(--ink-2);font-weight:500;white-space:nowrap}
.tag.warn{background:var(--mari-soft);color:var(--mari)}
.tag.good{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.info{background:var(--info-soft);color:var(--info)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:999px;font-size:13px;background:var(--surface-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.kw{background:var(--plum-soft);color:var(--plum)}
.logo{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;font:700 15px 'Bricolage Grotesque',sans-serif;color:#fff;background:hsl(var(--h) 42% 44%)}
.logo.lg{width:50px;height:50px;font-size:22px;border-radius:13px}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}

/* the trail */
.trail{display:flex;align-items:flex-start;margin:0 0 20px;padding:18px 10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow-x:auto}
.station{flex:1;min-width:104px;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.station::before{content:'';position:absolute;top:22px;right:50%;width:100%;height:3px;border-radius:3px;background:var(--line)}
.station.lit::before{background:var(--c)}
.station:first-child::before{display:none}
.station .dot{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--c);font:700 18px 'Bricolage Grotesque',sans-serif;border:3px solid var(--c);margin-bottom:4px}
.station.lit .dot{background:var(--c);color:var(--surface)}
.station .lbl{font-size:13.5px;font-weight:600}
.station .sub{font-size:12px;color:var(--ink-3)}
.trail .gap{width:1px;background:var(--line);margin:4px 6px;align-self:stretch}

/* board */
.board{display:grid;grid-template-columns:repeat(6,minmax(232px,1fr));gap:12px;align-items:start;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:14px;padding:8px;min-height:180px;display:flex;flex-direction:column;gap:8px;transition:background .15s}
.col.drop{outline:2px dashed var(--c);outline-offset:-2px;background:var(--cs)}
.col-head{display:flex;align-items:center;gap:8px;padding:6px 6px 4px;font-weight:600;font-size:14px}
.col-head .pip{width:9px;height:9px;border-radius:50%;background:var(--c)}
.col-head .n{color:var(--ink-3);font-weight:500}
.col-head .btn{margin-left:auto;padding:3px;color:var(--ink-3)}
.col-empty{font-size:13px;color:var(--ink-3);text-align:center;padding:18px 10px;border:1.5px dashed var(--line);border-radius:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;color:var(--ink)}
.card:hover{border-color:var(--ink-3)}
.card.dragging{opacity:.4}
.card-top{display:flex;gap:10px;align-items:flex-start}
.card h4{font-size:14.5px;font-weight:600;line-height:1.3}
.card .co{font-size:13px;color:var(--ink-2)}
.prio{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
.prio.high{background:var(--bad)}.prio.med{background:var(--mari-bright)}.prio.low{background:var(--line)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--ink-2)}
.meta span{display:inline-flex;align-items:center;gap:4px}
.card .tags{display:flex;flex-wrap:wrap;gap:5px}

/* table */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--ink-2);font-size:13px;padding:0;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
th button{all:unset;display:flex;gap:4px;align-items:center;padding:11px 14px;cursor:pointer;width:100%;box-sizing:border-box}
th button:focus-visible{outline:2px solid var(--plum);outline-offset:-2px}
td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td .cell-co{display:flex;align-items:center;gap:10px;font-weight:600}
td .cell-co .logo{width:26px;height:26px;font-size:12px;border-radius:7px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.panel h3{font-size:16px;font-weight:600}
.panel .sub{font-size:13px;color:var(--ink-3);margin:2px 0 14px}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.panel.wide{grid-column:1/-1}
.chart-box{position:relative;height:240px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font:700 26px/1.15 'Bricolage Grotesque',sans-serif}
.kpi span{font-size:13px;color:var(--ink-2)}
.report{margin-top:14px}
.report h3{margin-bottom:10px}
.md{line-height:1.65;max-width:76ch}
.md h1,.md h2{font-size:18px;margin:20px 0 6px}
.md h3,.md h4{font-size:15.5px;margin:16px 0 4px}
.md>*:first-child{margin-top:0}
.md p{margin:6px 0}
.md ul,.md ol{margin:6px 0;padding-left:22px}
.md li{margin:3px 0}
.ai-empty{text-align:center;padding:30px 20px;border:1.5px dashed var(--line);border-radius:14px;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:12px}
.ai-empty p{max-width:52ch}
.skel{display:flex;flex-direction:column;gap:10px;padding:6px 0}
.skel i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:shimmer 1.2s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* companies */
.co-layout{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
.co-list{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;position:sticky;top:0;max-height:calc(100vh - 150px);overflow:auto}
.co-item{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;border:0;background:none;width:100%;text-align:left;color:var(--ink)}
.co-item:hover{background:var(--surface-2)}
.co-item[aria-current="true"]{background:var(--plum-soft)}
.co-item .nm{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co-item .s{display:block;font-size:12.5px;color:var(--ink-2)}
.co-detail{display:flex;flex-direction:column;gap:14px;min-width:0}
.co-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.co-head h2{font-size:24px}
.mini-stats{display:flex;flex-wrap:wrap;gap:12px 32px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.mini-stats b{display:block;font:700 22px 'Bricolage Grotesque',sans-serif}
.mini-stats span{font-size:12.5px;color:var(--ink-2)}
.co-apps{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.co-app{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:none;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.co-app:hover{border-color:var(--ink-3)}
.co-app b{display:block;font-weight:600}
.tl{list-style:none;margin:12px 0 0;padding:0}
.tl li{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:0 0 16px;position:relative}
.tl li::before{content:'';position:absolute;left:70px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--c)}
.tl li::after{content:'';position:absolute;left:74px;top:20px;bottom:2px;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li>div:last-child{padding-left:20px}
.tl-date{font-size:13px;color:var(--ink-2);font-weight:500;padding-top:1px}
.tl-note{font-size:13.5px;margin-top:4px;color:var(--ink-2)}
.rpill{font-size:12px;font-weight:600;color:var(--c);background:var(--cs);padding:1px 8px;border-radius:999px;margin-left:6px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,12,28,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(740px,100%);background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:41;display:flex;flex-direction:column;outline:none}
.drawer.open{transform:none}
.d-head{padding:18px 22px 0;padding-top:calc(18px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.d-title{display:flex;gap:12px;align-items:flex-start}
.d-title input{border:0;background:none;width:100%;padding:2px 6px;margin-left:-6px;border-radius:6px;outline:none}
.d-title input:hover,.d-title input:focus{background:var(--surface-2)}
.d-title .role{font:700 21px 'Bricolage Grotesque',sans-serif;color:var(--ink)}
.d-title .company{font-size:15px;color:var(--ink-2);margin-top:2px}
.d-sub{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.sel-wrap{position:relative;display:inline-flex}
.sel-wrap select{appearance:none;-webkit-appearance:none;border:0;padding:6px 28px 6px 12px;border-radius:999px;font-weight:600;font-size:13px;background:var(--cs);color:var(--c);cursor:pointer}
.sel-wrap::after{content:'';position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:2px solid var(--c);border-bottom:2px solid var(--c);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel-wrap option{background:var(--surface);color:var(--ink)}
.tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 12px;font-weight:500;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--plum);border-color:var(--plum);font-weight:600}
.tab .count{font-size:11.5px;background:var(--surface-2);color:var(--ink-2);padding:1px 7px;border-radius:999px}
.d-body{flex:1;overflow:auto;padding:22px 22px calc(40px + env(safe-area-inset-bottom,0px))}
.sec{margin-top:28px}
.sec h3{font-size:15.5px;font-weight:600;margin-bottom:12px}
.intro{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}
.intro p{max-width:52ch;color:var(--ink-2);font-size:14px}
.hist{list-style:none;padding:0;margin:0 0 0 5px;border-left:2px solid var(--line)}
.hist li{position:relative;padding:0 0 12px 18px;font-size:14px}
.hist li::before{content:'';position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--c)}
.hist li span{color:var(--ink-3);margin-left:6px;font-size:13px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.quick button{border:1px dashed var(--line);background:none;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.quick button:hover{border-color:var(--plum);color:var(--plum)}
.qa,.round{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.qa-head,.round-head{display:flex;gap:10px;align-items:flex-start}
.num{width:26px;height:26px;border-radius:50%;background:var(--plum-soft);color:var(--plum);font-weight:700;display:grid;place-items:center;font-size:13px;flex:none;margin-top:4px}
.qa textarea.q{font-weight:600;border:0;background:none;resize:none;padding:4px 6px;min-height:0;border-radius:6px;outline:none;width:100%;line-height:1.4}
.qa textarea.q:hover,.qa textarea.q:focus{background:var(--surface-2)}
.qa textarea.a{margin:10px 0}
.round-head input.rname{font-weight:600;font-size:15px;border:0;background:none;flex:1;padding:4px 6px;border-radius:6px;outline:none;min-width:0}
.round-head input.rname:hover,.round-head input.rname:focus{background:var(--surface-2)}
.round .grid4{margin:12px 0}
.stars{display:flex;align-items:center;gap:2px}
.star{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--line);padding:2px}
.star.on{color:var(--mari-bright)}
.stars .hint{margin-left:8px}
.callout{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--mari-soft);margin-bottom:16px;flex-wrap:wrap}
.callout p{flex:1;min-width:200px;font-size:14px}
.ai-hero{display:flex;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.ring{width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p) * 1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring b{width:76px;height:76px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:700 23px 'Bricolage Grotesque',sans-serif}
.ai-hero h3{font-size:16px;margin-bottom:4px}
.ai-hero p{font-size:14px;color:var(--ink-2)}
.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ai-grid .panel{padding:16px}
.ai-grid h4{font-size:14.5px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ai-grid ul,.ai-grid ol{margin:0;padding-left:20px;font-size:14px}
.ai-grid li{margin:4px 0}

/* dialogs & toasts */
dialog{border:0;border-radius:18px;padding:0;width:min(580px,calc(100% - 24px));max-height:calc(100% - 32px);background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(20,12,28,.42)}
.dlg-head{padding:22px 22px 0}
.dlg-head h2{font-size:21px}
.dlg-head p{margin-top:4px}
.dlg-body{padding:16px 22px}
.dlg-foot{padding:6px 22px 20px;display:flex;justify-content:flex-end;gap:8px}
details.paste{background:var(--mari-soft);border-radius:12px;padding:10px 14px;margin-bottom:16px}
details.paste summary{cursor:pointer;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;list-style:none}
details.paste summary::-webkit-details-marker{display:none}
details.paste summary .ic{color:var(--mari-bright)}
details.paste[open] summary{margin-bottom:10px}
details.paste textarea{background:var(--surface)}
details.paste .row{margin-top:8px}
.err{color:var(--bad);font-size:13.5px;margin-top:10px;min-height:1px}
.outcomes{display:grid;gap:8px}
.outcomes button{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;font-weight:500;color:var(--ink)}
.outcomes button:hover{border-color:var(--c);background:var(--cs)}
.outcomes button::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--c)}
#toasts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:70;width:max-content;max-width:calc(100% - 24px)}
.toast{background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;font-size:14px;box-shadow:var(--shadow);animation:pop .2s ease-out}
.toast button{background:none;border:0;color:var(--mari-bright);font-weight:700;cursor:pointer;padding:2px 4px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}

/* empty & settings */
.empty{max-width:540px;margin:56px auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty h2{font-size:30px;letter-spacing:-.02em}
.empty p{color:var(--ink-2);font-size:16px;max-width:44ch}
.settings{max-width:760px;display:flex;flex-direction:column;gap:14px}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 20px;margin:0}
.keys div{display:flex;align-items:center;gap:10px}
.keys dt{min-width:42px}.keys dd{margin:0;font-size:14px;color:var(--ink-2)}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .nav{order:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .brand,.nav kbd,.hide-sm{display:none!important}
  .nav-btn{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;width:auto;flex:1;align-items:center}
  .nav-foot{margin:0;display:contents}
  .topbar{padding:12px 16px;gap:10px}
  .topbar h1{font-size:21px}
  .search{order:3;width:100%}.search input{width:100%}.search kbd{display:none}
  #addBtn span{display:none}
  .content{padding:14px 14px 32px}
  .grid2,.ai-grid,.charts{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr}
  .co-layout{grid-template-columns:1fr}
  .co-list{position:static;max-height:240px}
  .board{grid-template-columns:repeat(6,84vw);scroll-snap-type:x mandatory}
  .col{scroll-snap-align:start}
  .d-head,.d-body{padding-left:16px;padding-right:16px}
  .ai-hero{flex-direction:column;text-align:center}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
@media print{
  .nav,.topbar,.no-print,.drawer,.scrim,#toasts,.filters{display:none!important}
  body,.panel,.kpi{background:#fff!important;color:#000}
  .app{display:block}.main{height:auto;overflow:visible}.content{overflow:visible;padding:0}
  .panel,.kpi{break-inside:avoid}
  .co-layout{display:block}.co-list{display:none}
  body.print-report .content>*:not(.print-target){display:none!important}
}

<!-- Google Sheet sync script (Apps Script). Single source of truth: the app copies this, with your secret filled in. -->
<script type="text/plain" id="sheet-script">
/**
 * Jobtrail <-> Google Sheets sync.
 * This script is bundled inside Jobtrail's index.html; the app copies it for you with your secret filled in.
 *
 * 1. Open an empty Google Sheet > Extensions > Apps Script. Replace the code with this file and save.
 * 2. Pick "setup" in the function menu and Run it once. Allow access when asked.
 * 3. Deploy > New deployment > Web app. Execute as: Me. Who has access: Anyone. Deploy.
 * 4. Copy the Web app URL (ends in /exec) into Jobtrail > Settings > Google Sheet sync.
 *
 * After editing this script later, use Deploy > Manage deployments > Edit > New version,
 * so the same URL keeps working.
 */
var SECRET = 'PASTE-YOUR-SECRET-HERE';
var SCRIPT_VERSION = 2; // bump when this script changes; Jobtrail prompts linked sheets to update

var SCHEMA = {
  Applications: ['id', 'company', 'role', 'status', 'priority', 'location', 'workMode', 'source', 'appliedOn', 'followUp', 'salaryExpected', 'salaryOffered', 'recruiter', 'contact', 'nextStep', 'tags', 'jdUrl', 'notes', 'jd', 'matchScore', 'aiAnalysis', 'createdAt', 'updatedAt'],
  Rounds: ['id', 'appId', 'order', 'name', 'type', 'date', 'mode', 'interviewer', 'status', 'rating', 'asked', 'notes'],
  Questions: ['id', 'appId', 'order', 'question', 'answer'],
  History: ['appId', 'status', 'at'],
  Reports: ['key', 'markdown', 'range', 'at'],
  Profile: ['key', 'value']
};
var STATUS = {saved: 'Saved', applied: 'Applied', screening: 'Screening', interviewing: 'Interviewing', offer: 'Offer', accepted: 'Accepted', rejected: 'Rejected', withdrawn: 'Withdrawn', ghosted: 'No response'};
var RSTATUS = {scheduled: 'Scheduled', awaiting: 'Awaiting result', passed: 'Cleared', failed: 'Not cleared', cancelled: 'Cancelled'};
var PRIORITY = {high: 'High', med: 'Medium', low: 'Low'};
var PLAIN = ['company', 'role', 'location', 'workMode', 'source', 'appliedOn', 'followUp', 'salaryExpected', 'salaryOffered', 'recruiter', 'contact', 'nextStep', 'tags', 'jdUrl', 'notes', 'jd', 'createdAt', 'updatedAt'];
var MAX_CELL = 49000;

// ---------- one-time setup ----------
function setup() {
  var ss = SpreadsheetApp.getActive();
  Object.keys(SCHEMA).forEach(function (name) {
    var cols = SCHEMA[name];
    var sh = ss.getSheetByName(name) || ss.insertSheet(name);
    sh.getRange(1, 1, sh.getMaxRows(), cols.length).setNumberFormat('@');
    sh.getRange(1, 1, 1, cols.length).setValues([cols]).setFontWeight('bold').setBackground('#EEE5F7');
    sh.setFrozenRows(1);
  });
  var apps = ss.getSheetByName('Applications');
  setList_(apps, 'status', values_(STATUS));
  setList_(apps, 'priority', values_(PRIORITY));
  setList_(ss.getSheetByName('Rounds'), 'status', values_(RSTATUS));
  apps.getRange(1, SCHEMA.Applications.indexOf('jd') + 1, apps.getMaxRows(), 2).setWrap(false);
  ss.getSheets().forEach(function (sh) {
    if (!SCHEMA[sh.getName()] && sh.getLastRow() === 0 && ss.getSheets().length > 1) ss.deleteSheet(sh);
  });
  ss.setActiveSheet(apps);
}
function values_(o) { return Object.keys(o).map(function (k) { return o[k]; }); }
function setList_(sh, col, list) {
  var c = SCHEMA[sh.getName()].indexOf(col) + 1;
  var rule = SpreadsheetApp.newDataValidation().requireValueInList(list, true).setAllowInvalid(true).build();
  sh.getRange(2, c, sh.getMaxRows() - 1, 1).setDataValidation(rule);
}

// ---------- web app ----------
function doGet() {
  return ContentService.createTextOutput('Jobtrail sync is running. Paste this URL into Jobtrail > Settings.');
}
function doPost(e) {
  try {
    var p = JSON.parse(e.postData.contents);
    if (!SECRET || SECRET.indexOf('PASTE-') === 0) return out_({ok: false, error: 'Set SECRET at the top of the Apps Script, then deploy a new version.'});
    if (p.secret !== SECRET) return out_({ok: false, error: 'The secret in Jobtrail does not match SECRET in the Apps Script.'});
    if (p.action === 'ping') return out_(meta_({ok: true}));
    if (p.action === 'pull') return out_(meta_(withLock_(function () { var d = readAll_(); d.ok = true; return d; })));
    if (p.action === 'push') return out_(meta_(withLock_(function () { return push_(p); })));
    return out_({ok: false, error: 'Unknown action.'});
  } catch (err) {
    return out_({ok: false, error: 'Sheet error: ' + (err && err.message ? err.message : err)});
  }
}
function meta_(o) {
  var ss = SpreadsheetApp.getActive();
  o.version = SCRIPT_VERSION; o.sheetName = ss.getName(); o.sheetUrl = ss.getUrl();
  return o;
}
function out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
function withLock_(fn) {
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try { return fn(); } finally { lock.releaseLock(); }
}

// ---------- sheet io ----------
function sheet_(name) {
  var sh = SpreadsheetApp.getActive().getSheetByName(name);
  if (!sh) throw new Error('Tab "' + name + '" is missing. Run setup in Apps Script.');
  return sh;
}
function header_(sh) { return sh.getRange(1, 1, 1, Math.max(1, sh.getLastColumn())).getValues()[0].map(String); }
function cell_(v) {
  if (v instanceof Date) {
    return (v.getHours() || v.getMinutes() || v.getSeconds()) ? v.toISOString() : Utilities.formatDate(v, Session.getScriptTimeZone(), 'yyyy-MM-dd');
  }
  return v === null || v === undefined ? '' : v;
}
function read_(name) {
  var sh = sheet_(name), last = sh.getLastRow();
  if (last < 2) return [];
  var head = header_(sh);
  return sh.getRange(2, 1, last - 1, head.length).getValues()
    .filter(function (r) { return r.some(function (c) { return c !== '' && c !== null; }); })
    .map(function (r) { var o = {}; head.forEach(function (h, i) { if (h) o[h] = cell_(r[i]); }); return o; });
}
function write_(name, rows) {
  var sh = sheet_(name), head = header_(sh), last = sh.getLastRow();
  SCHEMA[name].forEach(function (c) { if (head.indexOf(c) < 0) throw new Error('Column "' + c + '" is missing in tab ' + name + '. Run setup again.'); });
  if (last > 1) sh.getRange(2, 1, last - 1, head.length).clearContent();
  if (!rows.length) return;
  var need = rows.length + 1 - sh.getMaxRows();
  if (need > 0) sh.insertRowsAfter(sh.getMaxRows(), need);
  var vals = rows.map(function (o) {
    return head.map(function (c) {
      var v = c ? o[c] : '';
      if (v === undefined || v === null) v = '';
      v = String(v);
      return v.length > MAX_CELL ? v.slice(0, MAX_CELL) : v;
    });
  });
  sh.getRange(2, 1, vals.length, head.length).setNumberFormat('@').setValues(vals);
}
function str_(v) { return v === undefined || v === null ? '' : String(v); }
function key_(map, v, dflt) {
  var s = str_(v).trim().toLowerCase();
  if (!s) return dflt;
  for (var k in map) if (k === s || map[k].toLowerCase() === s) return k;
  return dflt;
}
function group_(rows) {
  var g = {};
  rows.forEach(function (r) { if (r.appId) (g[r.appId] = g[r.appId] || []).push(r); });
  return g;
}
function byOrder_(a, b) { return (Number(a.order) || 0) - (Number(b.order) || 0); }

// ---------- model mapping ----------
function toApp_(r, kids) {
  var ai = null;
  try { ai = r.aiAnalysis ? JSON.parse(r.aiAnalysis) : null; } catch (e) { ai = null; }
  var a = {id: str_(r.id), status: key_(STATUS, r.status, 'applied'), priority: key_(PRIORITY, r.priority, 'med'), ai: ai};
  PLAIN.forEach(function (k) { a[k] = str_(r[k]); });
  a.rounds = (kids.rounds[a.id] || []).slice().sort(byOrder_).map(function (x) {
    return {id: str_(x.id), name: str_(x.name), type: str_(x.type) || 'Other', date: str_(x.date), mode: str_(x.mode) || 'Video call', interviewer: str_(x.interviewer), status: key_(RSTATUS, x.status, 'scheduled'), rating: Math.max(0, Math.min(5, Number(x.rating) || 0)), asked: str_(x.asked), notes: str_(x.notes)};
  });
  a.questions = (kids.questions[a.id] || []).slice().sort(byOrder_).map(function (x) {
    return {id: str_(x.id), q: str_(x.question), a: str_(x.answer)};
  });
  a.history = (kids.history[a.id] || []).map(function (x) {
    return {status: key_(STATUS, x.status, 'applied'), at: str_(x.at)};
  }).sort(function (x, y) { return x.at < y.at ? -1 : x.at > y.at ? 1 : 0; });
  if (!a.history.length) a.history = [{status: a.status, at: a.createdAt || a.updatedAt}];
  return a;
}
function fromApp_(a) {
  var row = {
    id: a.id,
    status: STATUS[a.status] || 'Applied',
    priority: PRIORITY[a.priority] || 'Medium',
    matchScore: a.ai && a.ai.jd && typeof a.ai.jd.matchScore === 'number' ? a.ai.jd.matchScore : '',
    aiAnalysis: a.ai ? JSON.stringify(a.ai) : ''
  };
  PLAIN.forEach(function (k) { row[k] = a[k] || ''; });
  return {
    row: row,
    rounds: (a.rounds || []).map(function (x, i) {
      return {id: x.id, appId: a.id, order: i + 1, name: x.name, type: x.type, date: x.date, mode: x.mode, interviewer: x.interviewer, status: RSTATUS[x.status] || 'Scheduled', rating: x.rating || '', asked: x.asked, notes: x.notes};
    }),
    questions: (a.questions || []).map(function (x, i) {
      return {id: x.id, appId: a.id, order: i + 1, question: x.q, answer: x.a};
    }),
    history: (a.history || []).map(function (h) {
      return {appId: a.id, status: STATUS[h.status] || h.status, at: h.at};
    })
  };
}

// ---------- operations ----------
// Gives ids and timestamps to rows typed straight into the sheet.
function ensureIds_(apps, rounds, qs) {
  var now = new Date().toISOString(), dirty = {};
  apps.forEach(function (r) {
    if (!r.id && (r.company || r.role)) { r.id = Utilities.getUuid(); dirty.a = 1; }
    if (r.id && !r.updatedAt) { r.updatedAt = now; dirty.a = 1; }
    if (r.id && !r.createdAt) { r.createdAt = r.updatedAt || now; dirty.a = 1; }
  });
  rounds.forEach(function (r) { if (!r.id && r.appId) { r.id = Utilities.getUuid(); dirty.r = 1; } });
  qs.forEach(function (r) { if (!r.id && r.appId) { r.id = Utilities.getUuid(); dirty.q = 1; } });
  if (dirty.a) write_('Applications', apps);
  if (dirty.r) write_('Rounds', rounds);
  if (dirty.q) write_('Questions', qs);
}
function readAll_() {
  var apps = read_('Applications'), rounds = read_('Rounds'), qs = read_('Questions'), hist = read_('History');
  ensureIds_(apps, rounds, qs);
  var kids = {rounds: group_(rounds), questions: group_(qs), history: group_(hist)};
  return {
    apps: apps.filter(function (r) { return r.id; }).map(function (r) { return toApp_(r, kids); }),
    reports: readReports_(),
    profile: readProfile_()
  };
}
function push_(p) {
  var apps = read_('Applications'), rounds = read_('Rounds'), qs = read_('Questions'), hist = read_('History');
  ensureIds_(apps, rounds, qs);
  var byId = {}, order = [];
  apps.forEach(function (r) { if (r.id) { byId[r.id] = r; order.push(r.id); } });
  var touched = {}, del = {}, conflicts = [];
  (p.apps || []).forEach(function (a) {
    if (!a || !a.id) return;
    var cur = byId[a.id];
    if (cur && str_(cur.updatedAt) > str_(a.updatedAt)) { conflicts.push(a.id); return; }
    var f = fromApp_(a), merged = {};
    Object.keys(cur || {}).forEach(function (k) { merged[k] = cur[k]; }); // keeps any extra columns you added
    Object.keys(f.row).forEach(function (k) { merged[k] = f.row[k]; });
    if (!cur) order.push(a.id);
    byId[a.id] = merged;
    touched[a.id] = f;
  });
  (p.deletes || []).forEach(function (id) { if (byId[id]) { del[id] = 1; delete byId[id]; } });
  var changed = Object.keys(touched).length || Object.keys(del).length;
  if (changed) {
    var keep = function (r) { return !del[r.appId] && !touched[r.appId]; };
    rounds = rounds.filter(keep); qs = qs.filter(keep); hist = hist.filter(keep);
    Object.keys(touched).forEach(function (id) {
      rounds = rounds.concat(touched[id].rounds); qs = qs.concat(touched[id].questions); hist = hist.concat(touched[id].history);
    });
    var appRows = order.filter(function (id) { return byId[id]; }).map(function (id) { return byId[id]; })

// ---------- Gemini ----------
async function gemini(prompt, {json = false, temperature = 0.4} = {}) {
  const s = db.settings;
  if (!s.apiKey) throw new Error('Add your Gemini API key in Settings first.');
  const model = (s.model || 'gemini-2.5-flash').trim().replace(/^models\//, '');
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
    method:'POST',
    headers:{'Content-Type':'application/json', 'x-goog-api-key':s.apiKey.trim()},
    body:JSON.stringify({contents:[{role:'user', parts:[{text:prompt}]}], generationConfig:{temperature, ...(json ? {responseMimeType:'application/json'} : {})}})
  });
  let data;
  try { data = await res.json(); } catch { throw new Error(`Gemini sent an unreadable response (HTTP ${res.status}).`); }
  if (!res.ok) throw new Error('Gemini: ' + (data?.error?.message || `request failed (HTTP ${res.status})`));
  const cand = data.candidates?.[0];
  const text = (cand?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('').trim();
  if (!text) throw new Error(cand?.finishReason ? `Gemini returned no text (reason: ${cand.finishReason}).` : 'Gemini returned an empty response.');
  if (!json) return text;
  try { return JSON.parse(text.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '')); }
  catch { throw new Error('Gemini returned malformed JSON. Run it again.'); }
}
async function listModels() {
  const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', {headers:{'x-goog-api-key':db.settings.apiKey.trim()}});
  const d = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error('Gemini: ' + (d?.error?.message || `HTTP ${res.status}`));
  return (d.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent') && /gemini/i.test(m.name)).map(m => ({id:m.name.replace(/^models\//, ''), label:m.displayName || m.name}));
}
function aiError(e) {
  toast(e instanceof TypeError ? "Couldn't reach Gemini. Check your connection, and open this tracker from the downloaded file rather than a hosted link." : e.message, {ms:9000});
}
function busyBtn(btn, label) { if (!btn) return; btn.disabled = true; btn.innerHTML = `<span class="spin"></span>${esc(label)}`; }
const resumeBlock = (max = 12000) => `Candidate target roles: ${db.settings.targetRole || 'not specified'}\nCANDIDATE RESUME:\n${db.settings.resume ? db.settings.resume.slice(0, max) : '(not provided)'}`;
const md = s => {
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(String(s || '')));
  return esc(s).replace(/^#{1,3} (.*)$/gm, '<h3>$1</h3>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^\s*(?:[-*]|\d+\.) (.*)$/gm, '<li>$1</li>').replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
};

function inRange(apps) {

}
function weekStart(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function computeStats(apps) {
  const applied = apps.filter(a => reached(a) >= 1);
  const rts = applied.map(firstResponseDays).filter(x => x != null);
  const s = {
    applied:applied.length,
    active:apps.filter(isActive).length,
    responded:applied.filter(responded).length,
    interviews:applied.filter(a => reached(a) >= 3).length,
    offers:applied.filter(a => reached(a) >= 4).length,
    avgRT:rts.length ? Math.round(rts.reduce((t, x) => t + x, 0) / rts.length) : null,
    funnel:[1, 2, 3, 4].map(r => applied.filter(a => reached(a) >= r).length)
  };
  const dates = applied.map(a => a.appliedOn).filter(Boolean).sort();
  let n = ui.range === '30' ? 5 : ui.range === '90' ? 13 : 8;
  if (ui.range === 'all' && dates.length) n = Math.min(26, Math.max(8, Math.ceil(diffDays(day(weekStart(toDate(dates[0]))), todayISO()) / 7) + 1));
  const start = weekStart(new Date()), weeks = [];
  for (let i = n - 1; i >= 0; i--) { const d = new Date(start); d.setDate(d.getDate() - 7 * i); weeks.push(d); }
  s.weekLabels = weeks.map(w => fmtDate(day(w)));
  s.weekly = weeks.map(w => { const nx = new Date(w); nx.setDate(nx.getDate() + 7); return applied.filter(a => { const d = toDate(a.appliedOn); return d && d >= w && d < nx; }).length; });
  s.src = {};
  applied.forEach(a => { const k = a.source || 'Not set'; const o = s.src[k] || (s.src[k] = {applied:0, responded:0, interviews:0, offers:0}); o.applied++; if (responded(a)) o.responded++; if (reached(a) >= 3) o.interviews++; if (reached(a) >= 4) o.offers++; });
  s.byStatus = {}; apps.forEach(a => { s.byStatus[a.status] = (s.byStatus[a.status] || 0) + 1; });
  s.rtype = {};
  apps.forEach(a => a.rounds.forEach(r => { if (r.status === 'cancelled') return; const k = r.type || 'Other'; const o = s.rtype[k] || (s.rtype[k] = {cleared:0, notCleared:0, pending:0}); if (r.status === 'passed') o.cleared++; else if (r.status === 'failed') o.notCleared++; else o.pending++; }));
  s.loc = {}; apps.forEach(a => { const k = a.location || 'Not set'; s.loc[k] = (s.loc[k] || 0) + 1; });
  s.mode = {}; apps.forEach(a => { const k = a.workMode || 'Not set'; s.mode[k] = (s.mode[k] || 0) + 1; });
  return s;
}

function loadConn() {

}
function saveConn() { try { localStorage.setItem(CONN_KEY, JSON.stringify(conn)); } catch {} }

}
const linkCode = () => 'jobtrail:' + btoa(JSON.stringify({u:conn.url, s:conn.secret}));
function parseLinkCode(v) {

  try { const o = JSON.parse(atob(v.slice(9))); return o.u && o.s ? {url:o.u, secret:o.s} : null; } catch { return null; }
}
const sync = (() => {
  try { const s = JSON.parse(localStorage.getItem(SYNC_KEY) || '{}'); return {dirty:new Set(s.dirty || []), deleted:new Set(s.deleted || []), metaDirty:!!s.metaDirty, lastSync:s.lastSync || null}; }

})();
const syncSt = {state:'idle', error:'', inflight:false, timer:null, retry:null};

function markDirty(id) { sync.deleted.delete(id); sync.dirty.add(id); persistSync(); }
function markDeleted(id) { sync.dirty.delete(id); sync.deleted.add(id); persistSync(); }
function markMeta() { sync.metaDirty = true; persistSync(); }
const pendingCount = () => sync.dirty.size + sync.deleted.size + (sync.metaDirty ? 1 : 0);

function timeAgo(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60); return h < 24 ? h + 'h ago' : rel(iso);
}

async function callSheet(payload, c = conn) {
  const res = await fetch(c.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({...payload, secret:c.secret}), redirect:'follow'});
  const text = await res.text();

  catch { throw new Error(res.ok ? "The link didn't return Jobtrail data. Use the Web app URL ending in /exec, with access set to Anyone." : `The sheet request failed (HTTP ${res.status}).`); }

const syncErr = e => e instanceof TypeError ? (navigator.onLine ? "Couldn't reach the sheet. Check the Web app URL and that access is set to Anyone." : "You're offline. Changes will sync when you reconnect.") : e.message;
function setSync(state) { syncSt.state = state; renderSyncState(); }
function renderSyncState() {

  else if (syncSt.state === 'syncing') { txt = 'Syncing with sheet'; dot = 'busy'; }
  else if (syncSt.state === 'error') { txt = n ? `Not synced: ${plural(n, 'change')} waiting` : 'Sheet sync needs attention'; dot = 'bad'; }
  else if (n) { txt = `${plural(n, 'change')} waiting to sync`; dot = 'warn'; }
  else if (outdated()) { txt = 'Saved to sheet. Script update available'; dot = 'warn'; }

function refreshViews() {

function applyServerApp(sa) {

async function pushNow() {

    ids.forEach(id => { const a = getApp(id); if (!a || a.updatedAt === snap.get(id)) sync.dirty.delete(id); });
    deletes.forEach(id => sync.deleted.delete(id));

}
function mergeServer(d, initial) {

    if (localOnly.length && confirm(`Upload ${plural(localOnly.length, 'application')} from this browser to your sheet?\n\nChoose Cancel to keep only what's already in the sheet.`)) localOnly.forEach(a => sync.dirty.add(a.id));

async function syncNow() { await pushNow(); await pullNow(); if (!syncSt.error) toast('Synced with your sheet.'); }
async function connectSheet(btn) {

      <label class="field full"><span>Web app URL or link code</span><input class="input" id="sUrl" placeholder="https://script.google.com/macros/s/…/exec  or  jobtrail:…" spellcheck="false" autocomplete="off"></label>
    </div>
    <div class="row wrap" style="margin-top:12px"><button class="btn btn-primary" data-act="sheet-connect">Link sheet</button></div>
    ${ui.sheetStatus ? `<p class="err" role="alert">${esc(ui.sheetStatus)}</p>` : ''}
    <details class="conn"><summary>Advanced</summary><div class="grid2" style="margin-top:10px">${secretField}</div></details>`;
  const badge = !on ? '<span class="pill st-screening">Not linked</span>' : syncSt.state === 'error' ? '<span class="pill st-rejected">Needs attention</span>' : outdated() ? '<span class="pill st-screening">Update available</span>' : '<span class="pill st-offer">Linked</span>';
  if (on) return `<section class="panel"><div class="row between wrap"><h3>Google Sheet</h3>${badge}</div>
    <p class="sub">Linked to ${conn.sheetLink ? `<a href="${esc(conn.sheetLink)}" target="_blank" rel="noopener">${esc(conn.sheetName || 'your sheet')}</a>` : esc(conn.sheetName || 'your sheet')}${conn.linkedAt ? ' since ' + fmtDate(conn.linkedAt) : ''}. The link stays in this browser until you unlink it or clear the site's storage.</p>
    <div class="row wrap"><button class="btn" data-act="sync-now">Sync now</button>${conn.sheetLink ? `<a class="btn" href="${esc(conn.sheetLink)}" target="_blank" rel="noopener">${icon('link', 16)} Open sheet</a>` : ''}<button class="btn" data-act="copy-link">${icon('copy', 16)} Copy link code</button><button class="btn btn-ghost danger" data-act="sheet-disconnect">Unlink</button></div>
    <p class="hint" style="margin-top:10px">${sync.lastSync ? 'Last synced ' + timeAgo(sync.lastSync) : ''}${pendingCount() ? `, ${plural(pendingCount(), 'change')} waiting` : ''}. Use the link code to connect your phone or another browser in one paste, and keep a copy somewhere safe, like your password manager.</p>
    ${syncSt.error ? `<p class="err">${esc(syncSt.error)}</p>` : ''}
    ${outdated() ? `<div class="callout" style="margin:14px 0 0"><p>A newer sheet script is available (version ${SCRIPT_VERSION}, yours is ${conn.version || 1}). Copy it, paste it over the old code in Apps Script, then choose <b>Deploy › Manage deployments › Edit › Version: New version › Deploy</b>. The URL stays the same.</p><button class="btn btn-sm" data-act="copy-script">${icon('copy', 15)} Copy new script</button></div>` : ''}
    <details class="conn"><summary>Setup script and secret</summary><div class="row wrap" style="margin-top:10px"><button class="btn btn-sm" data-act="copy-script">${icon('copy', 15)} Copy setup script</button><button class="btn btn-sm btn-ghost" data-act="download-script">${icon('download', 15)} Download Code.gs</button></div></details>
  </section>`;
  return `<section class="panel"><div class="row between wrap"><h3>Google Sheet</h3>${badge}</div>
    <p class="sub">Your data lives in a Google Sheet you own: one row per application, with rounds, questions, stage history, reports and your profile in their own tabs. Changes sync within seconds, and edits made in the sheet show up here.</p>
    <h4 style="font-size:14.5px;margin:4px 0 8px">Already linked on another device?</h4>
    <p class="hint">Copy its link code (Settings › Google Sheet) and paste it below.</p>
    <h4 style="font-size:14.5px;margin:18px 0 8px">First time? Set up a sheet</h4>
    <ol class="steps">
      <li>Create a new Google Sheet at <a href="https://sheets.new" target="_blank" rel="noopener">sheets.new</a>, then open <b>Extensions › Apps Script</b>.</li>
      <li>Delete the sample code, paste the setup script and save. Your private secret is already in it.
        <div class="row wrap" style="margin-top:8px"><button class="btn btn-sm" data-act="copy-script">${icon('copy', 15)} Copy setup script</button><button class="btn btn-sm btn-ghost" data-act="download-script">${icon('download', 15)} Download Code.gs</button></div></li>
      <li>Pick <b>setup</b> in the function menu, select <b>Run</b> and allow access. It creates the tabs.</li>
      <li>Select <b>Deploy › New deployment</b>, choose <b>Web app</b>, set <i>Execute as</i> to <b>Me</b> and <i>Who has access</i> to <b>Anyone</b>. Deploy and copy the Web app URL.</li>
      <li>Paste the URL below and link.</li>
    </ol>${linkForm}
  </section>`;
}
function initSync() {
  renderSyncState();
  if (connected()) pullNow();
  setInterval(renderSyncState, 30000);
  setInterval(() => { if (document.visibilityState === 'visible' && connected() && !pendingCount()) pullNow(); }, 60000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { if (connected()) pushNow().then(() => pullNow()); }
    else beaconFlush();
  });
  window.addEventListener('pagehide', beaconFlush);
  window.addEventListener('online', () => { if (connected()) pushNow(); });
}

// ---------- routing & render ----------
const VIEWS = {board:['Board', renderBoard], list:['All applications', renderList], companies:['Companies', renderCompanies], insights:['Insights', renderInsights], settings:['Settings', renderSettings]};
function render() {
  const [title, fn] = VIEWS[ui.view];
  $('#viewTitle').textContent = title;
  $$('.nav-btn[data-view]').forEach(b => b.dataset.view === ui.view ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  $('.search').style.display = ['settings', 'insights'].includes(ui.view) ? 'none' : '';
  destroyCharts();
  fn($('#content'));
}
let renderT;
function renderSoon() { clearTimeout(renderT); renderT = setTimeout(render, 220); }
function go(view) { ui.view = view; render(); $('#content').scrollTop = 0; }
const isDark = () => db.settings.theme === 'dark' || (db.settings.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
function applyTheme() {
  const t = db.settings.theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  $('#themeBtn').innerHTML = `${icon(isDark() ? 'sun' : 'moon')}<span>${isDark() ? 'Light mode' : 'Dark mode'}</span>`;
}

// ---------- events ----------
document.addEventListener('click', e => {
  if (e.target.tagName === 'DIALOG') { e.target.close(); return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, a = ui.openId ? getApp(ui.openId) : null;
  const findR = () => a && a.rounds.find(r => r.id === t.dataset.id);
  switch (act) {
    case 'go': closeDrawer(); go(t.dataset.view); break;
    case 'open': openDrawer(t.dataset.id); break;
    case 'add': openAdd(t.dataset.status || 'applied'); break;
    case 'sample': loadSample(); break;
    case 'remove-sample': db.apps.filter(x => x.sample).forEach(x => markDeleted(x.id)); db.apps = db.apps.filter(x => !x.sample); save(); render(); toast('Sample data removed.'); break;
    case 'clear-filters': ui.filters = {source:'', mode:'', priority:'', status:''}; ui.q = ''; $('#q').value = ''; render(); break;
    case 'close': closeDrawer(); break;
    case 'delete': if (a) deleteApp(a); break;
    case 'tab': ui.tab = t.dataset.tab; renderDrawer(); break;
    case 'seg': if (a) { a[t.dataset.field] = t.dataset.v; touch(a); $$(`[data-act="seg"][data-field="${t.dataset.field}"]`).forEach(b => b.setAttribute('aria-pressed', b === t)); renderSoon(); } break;
    case 'add-round': if (a) {
      a.rounds.push({id:uid(), name:'', type:a.rounds.length ? 'Technical' : 'Recruiter call', date:'', mode:'Video call', interviewer:'', status:'scheduled', rating:0, asked:'', notes:''});
      touch(a); renderDrawer(); const ins = $$('#dbody .rname'); ins[ins.length - 1]?.focus(); $('#dbody').scrollTop = $('#dbody').scrollHeight;
      if (['applied','screening'].includes(a.status)) toast('Round added. Move this application to Interviewing?', {label:'Move', action:() => { setStatus(a, 'interviewing'); renderDrawer(); renderSoon(); }});
      renderSoon();
    } break;
    case 'del-round': if (a) { const i = a.rounds.findIndex(r => r.id === t.dataset.id); const [r] = a.rounds.splice(i, 1); touch(a); renderDrawer(); renderSoon(); toast('Round deleted.', {action:() => { a.rounds.splice(i, 0, r); touch(a); renderDrawer(); renderSoon(); }}); } break;
    case 'rate': { const r = findR(); if (r) { const v = +t.dataset.v; r.rating = r.rating === v ? 0 : v; touch(a); renderDrawer(); renderSoon(); } } break;
    case 'add-q': if (a) { const q = {id:uid(), q:t.dataset.text || '', a:''}; a.questions.push(q); touch(a); renderDrawer(); setTimeout(() => (t.dataset.text ? $('#ans-' + q.id) : $(`[data-q="${q.id}"][data-qf="q"]`))?.focus(), 20); } break;
    case 'del-q': if (a) { const i = a.questions.findIndex(q => q.id === t.dataset.id); const [q] = a.questions.splice(i, 1); touch(a); renderDrawer(); toast('Question deleted.', {action:() => { a.questions.splice(i, 0, q); touch(a); renderDrawer(); }}); } break;
    case 'copy-ans': { const v = $('#ans-' + t.dataset.id)?.value || ''; if (v.trim()) copyText(v); else toast('Nothing to copy yet.'); } break;
    case 'copy-text': copyText(t.dataset.text || ''); break;
    case 'ai-jd': if (a) aiJD(a); break;
    case 'ai-q': if (a) aiQuestions(a, t.dataset.id, t); break;
    case 'ai-company': aiCompany(t.dataset.key || ui.company, t); break;
    case 'ai-pipeline': aiPipeline(t); break;
    case 'company-of': if (a) { const k = coKey(a.company); closeDrawer(); ui.company = k; go('companies'); } break;
    case 'goto-settings': closeDrawer(); go('settings'); break;
    case 'sort': { const k = t.dataset.key; ui.sort = ui.sort.key === k ? {key:k, dir:-ui.sort.dir} : {key:k, dir:['updatedAt','appliedOn','rounds','match'].includes(k) ? -1 : 1}; render(); } break;
    case 'co': ui.company = t.dataset.key; render(); $('#content').scrollTop = 0; break;
    case 'range': ui.range = t.dataset.v; render(); break;
    case 'print': window.print(); break;
    case 'export-json': download(`jobtrail-backup-${todayISO()}.json`, JSON.stringify({...db, settings:{...db.settings, apiKey:''}}, null, 2), 'application/json'); toast('Backup downloaded.'); break;
    case 'import-json': $('#importFile').click(); break;
    case 'export-csv': exportCSV(); break;
    case 'wipe': if (confirm(connected() ? "Delete every application and report from this browser AND from your Google Sheet? This can't be undone." : "Delete every application and report stored in this browser? This can't be undone.")) { db.apps.forEach(x => markDeleted(x.id)); db.apps = []; db.reports = {companies:{}, pipeline:null}; markMeta(); save(); closeDrawer(); render(); toast('All applications deleted.'); } break;
    case 'sync-click': if (!connected() || syncSt.state === 'error' || (outdated() && !pendingCount())) { closeDrawer(); go('settings'); } else syncNow(); break;
    case 'sync-now': syncNow(); break;
    case 'copy-script': copyText(sheetScript()); break;
    case 'download-script': download('Code.gs', sheetScript(), 'text/plain'); break;
    case 'sheet-connect': connectSheet(t); break;
    case 'sheet-disconnect': unlinkSheet(); break;
    case 'copy-link': copyText(linkCode()); break;
    case 'toggle-key': { const k = $('#sKey'); const show = k.type === 'password'; k.type = show ? 'text' : 'password'; t.textContent = show ? 'Hide' : 'Show'; } break;
    case 'load-models': (async () => { if (!db.settings.apiKey) { ui.keyStatus = 'Add your API key first.'; render(); return; } busyBtn(t, 'Loading'); try { ui.models = await listModels(); ui.keyStatus = `Found ${plural(ui.models.length, 'model')}. Pick one in the Model field.`; } catch (err) { ui.keyStatus = err instanceof TypeError ? "Couldn't reach Gemini. Check your connection." : err.message; } render(); })(); break;
    case 'test-key': (async () => { busyBtn(t, 'Testing'); try { const r = await gemini('Reply with exactly the word: ready', {temperature:0}); ui.keyStatus = `Connected to ${db.settings.model}. Gemini replied “${r.slice(0, 40)}”.`; } catch (err) { ui.keyStatus = err instanceof TypeError ? "Couldn't reach Gemini. Check your connection." : err.message; } render(); })(); break;
    case 'theme': db.settings.theme = isDark() ? 'light' : 'dark'; applyTheme(); save(); render(); break;
    case 'theme-set': db.settings.theme = t.dataset.v; applyTheme(); save(); render(); break;
    case 'dlg-cancel': t.closest('dialog')?.close(); break;
    case 'fill': aiFill(t); break;
    case 'add-save': saveAdd(); break;
    case 'outcome': { const x = getApp(ui.pendingOutcome); $('#outcomeDlg').close(); if (x) { const prev = x.status; setStatus(x, t.dataset.v); render(); toast(`Closed as ${SLABEL[t.dataset.v].toLowerCase()}.`, {action:() => { x.status = prev; x.history.pop(); touch(x); render(); }}); } } break;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') { ui.q = el.value; renderSoon(); return; }
  if (el.dataset.s !== undefined) { db.settings[el.dataset.s] = el.value; if (['resume','targetRole'].includes(el.dataset.s)) markMeta(); save(); return; }
  const a = ui.openId && el.closest('#drawer') ? getApp(ui.openId) : null;
  if (!a) return;
  if (el.dataset.f) {
    a[el.dataset.f] = el.value; touch(a);
    if (el.dataset.f === 'jdUrl') { const l = $('#jdOpen'), u = safeUrl(el.value.trim()); l.href = u || '#'; l.hidden = !u; }
    if (el.dataset.f === 'jd') { const w = el.value.trim().split(/\s+/).filter(Boolean).length; $('#jdWords').textContent = plural(w, 'word'); const b = $('[data-act="ai-jd"]', $('#dbody')); if (b) { b.disabled = !el.value.trim(); b.removeAttribute('title'); } }
    if (el.dataset.f === 'company') { const lg = $('#drawer .d-title .logo'); lg.style.setProperty('--h', hue(el.value)); lg.textContent = initial(el.value); }
    renderSoon(); return;
  }
  if (el.dataset.rf) { const r = a.rounds.find(x => x.id === el.dataset.r); if (r) { r[el.dataset.rf] = el.value; touch(a); if (el.dataset.rf === 'status') el.parentElement.className = 'sel-wrap rs-' + el.value; renderSoon(); } return; }
  if (el.dataset.qf) { const q = a.questions.find(x => x.id === el.dataset.q); if (q) { q[el.dataset.qf] = el.value; touch(a); } }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.filter) { ui.filters[el.dataset.filter] = el.value; render(); return; }
  if (el.hasAttribute('data-status')) { const a = getApp(ui.openId); if (a) { setStatus(a, el.value); renderDrawer(); renderSoon(); } return; }
  if (el.id === 'importFile' && el.files[0]) {
    const f = el.files[0], r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!Array.isArray(d.apps)) throw new Error('bad');
        if (!confirm(`Replace your current ${plural(db.apps.length, 'application')} with ${plural(d.apps.length, 'application')} from this backup?`)) return;
        const cur = db.settings, def = defaults(), oldIds = db.apps.map(x => x.id);
        db = {apps:d.apps.map(normalize), settings:{...def.settings, ...(d.settings || {}), apiKey:(d.settings && d.settings.apiKey) || cur.apiKey}, reports:{...def.reports, ...(d.reports || {}), companies:{...((d.reports || {}).companies || {})}}};
        const newIds = new Set(db.apps.map(x => x.id));
        oldIds.filter(id => !newIds.has(id)).forEach(markDeleted);
        db.apps.forEach(x => { x.updatedAt = nowISO(); markDirty(x.id); }); markMeta();
        save(); applyTheme(); render(); toast(connected() ? 'Backup imported. Syncing it to your sheet.' : 'Backup imported.');
      } catch { toast("That file isn't a Jobtrail backup."); }
      el.value = '';
    };
    r.readAsText(f);
  }
});
document.addEventListener('keydown', e => {
  const tag = e.target.tagName, typing = ['INPUT','TEXTAREA','SELECT'].includes(tag) || e.target.isContentEditable;
  const dlgOpen = !!document.querySelector('dialog[open]');
  if (e.key === 'Escape') { if (dlgOpen) return; if (ui.openId) { e.preventDefault(); closeDrawer(); } else if (e.target.id === 'q') e.target.blur(); return; }
  if (e.key === 'Enter' && tag === 'INPUT' && e.target.closest('#addDlg')) { e.preventDefault(); saveAdd(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && !typing && e.target.matches('[data-act="open"]:not(button)')) { e.preventDefault(); openDrawer(e.target.dataset.id); return; }
  if (typing || dlgOpen || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); closeDrawer(); $('#q').focus(); }
  else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openAdd(); }
  else if (['1','2','3','4'].includes(e.key) && !ui.openId) go(['board','list','companies','insights'][+e.key - 1]);
});
const content = $('#content');
content.addEventListener('dragstart', e => { const c = e.target.closest?.('.card'); if (!c) return; e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging'); });
content.addEventListener('dragend', e => { e.target.closest?.('.card')?.classList.remove('dragging'); $$('.col.drop').forEach(x => x.classList.remove('drop')); });
content.addEventListener('dragover', e => { const col = e.target.closest?.('.col'); if (!col) return; e.preventDefault(); $$('.col.drop').forEach(x => x !== col && x.classList.remove('drop')); col.classList.add('drop'); });
content.addEventListener('dragleave', e => { const col = e.target.closest?.('.col'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('drop'); });
content.addEventListener('drop', e => {
  const col = e.target.closest?.('.col'); if (!col) return;
  e.preventDefault(); col.classList.remove('drop');
  const a = getApp(e.dataTransfer.getData('text/plain')); if (!a) return;
  const target = col.dataset.col; if (COLOF[a.status] === target) return;
  if (target === 'closed') { openOutcome(a.id); return; }
  const prev = a.status; setStatus(a, target); render();
  toast(`Moved to ${SLABEL[target]}.`, {action:() => { a.status = prev; a.history.pop(); touch(a); render(); }});
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (db.settings.theme === 'auto') { applyTheme(); render(); } });

// ---------- init ----------
$$('[data-icon]').forEach(el => { el.outerHTML = icon(el.dataset.icon); });
applyTheme();
render();
initSync();
})();
</script>
</body>
</html>
